[unix_http_server]
file=/tmp/supervisor.sock   ; the path to the socket file

[supervisord]
logfile=/tmp/supervisord.log ; main log file; default $CWD/supervisord.log
logfile_maxbytes=50MB        ; max main logfile bytes b4 rotation; default 50MB
logfile_backups=10           ; # of main logfile backups; 0 means none, default 10
loglevel=info                ; log level; default info; others: debug,warn,trace
pidfile=/tmp/supervisord.pid ; supervisord pidfile; default supervisord.pid
nodaemon=true                ; start in foreground if true; default false
silent=false                 ; no logs to stdout if true; default false
minfds=1024                  ; min. avail startup file descriptors; default 1024
minprocs=200                 ; min. avail process descriptors;default 200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock ; use a unix:// URL  for a unix socket

[program: pity]
# command=/usr/local/bin/gunicorn --config=/home/tester/pity/gunicorn.py main:pity
#
# ⚠️ -w 必须是 1, 不要改回 2 —— 2026-11-23 实测(scripts/logging_selftest.py 同源配置):
#   - loguru 的 rotation 按**各自进程的文件句柄**判断大小, 两个 worker 同时触发
#     rename 会互相覆盖, 双进程各写 1500 条 → 实际只剩 1313 / 1311, **丢 12.5% 日志**
#   - 反之多进程纯 append(rotation=None) 不丢(1500/1500), 但文件会无限增长
# 所以要么 -w 1(当前选择, rotation 正常), 要么 -w 2 + 关掉 loguru rotation 改用外层
# logrotate。单异步 worker 对这个 2 核 2G / memory limit 600M 的内部平台足够,
# 而且少一个 worker 少一份 Python 常驻内存, 更不容易撞 600M 上限。
command=/pity/venv/bin/gunicorn main:pity -b 0.0.0.0:7777 -w 1 -k uvicorn.workers.UvicornWorker --log-level info --access-logfile '-' --error-logfile '-'
directory=/pity
stdout_logfile=/pity/logs/gunicorn.log
stderr_logfile=/pity/logs/gunicorn.err
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=600
