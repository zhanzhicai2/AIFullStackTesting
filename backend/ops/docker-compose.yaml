version: "3"
services:

  mysql:
    image: mysql:8.0
    container_name: pity_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Pitytester666666
      MYSQL_DATABASE: pity
    networks:
      pity_net:
        aliases:
          - pity_mysql

  redis:
    image: redis
    container_name: pity_redis
    command: redis-server --requirepass 123456
    restart: always
    environment:
      - TZ=Asia/Shanghai
    networks:
      pity_net:
        aliases:
          - pity_redis

  pity:
    build:
      context: ../
      dockerfile: ops/dockerfile
      args:
        buildno: 1
    container_name: pity_server
    ports:
      - "7777:7777"
    restart: always
    environment:
      - TZ=Asia/Shanghai
    networks:
      pity_net:
        aliases:
        - pity_server
    volumes:
      - ./dev.env.ops:/pity/conf/dev.env
      # 日志落回 backend/logs/(与非容器方式 `python pity.py` 同一位置, .gitignore 已忽略)。
      # 该目录含 .gitkeep 恒存在, 不会踩「docker 自动建空目录」的坑
      - ../logs:/pity/logs

networks:
  pity_net:
