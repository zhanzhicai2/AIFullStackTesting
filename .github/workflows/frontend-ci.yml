# 新增于 2026-11-24
# 前端质量门禁:tsc 类型检查 + jest 单元测试 + IME 组合期浏览器探针
#
# 为什么需要:此前前端**没有任何东西进 CI** —— deploy-docker.yml 只 build 镜像
# (Dockerfile.production 里也只跑 `npm run build`),monitor-deploy.yml 只探后端健康。
# 前端自己的 `npm run lint`(含 tsc)和 `npm run test`(6 套件 / 85 用例)从来没跑过,
# 也就是说类型错误和测试回归可以一路合进 main 没人拦。
#
# 详见根 CLAUDE.md 的「CI/CD」小节

name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 + 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 必须钉 node 20(.nvmrc):node 22+ 移除了 process.binding('http_parser'),
          # jest 连配置文件都解析不了;umi 4.x 也不兼容 node 22/24
          node-version-file: 'frontend/.nvmrc'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --ignore-scripts:monorepo 子目录装依赖必须加,否则 prepare(husky install)会干扰
      # 依赖装完再单独跑 max setup —— 它原本是 postinstall,被 --ignore-scripts 跳过了,
      # 但 src/.umi 是 tsc 认 "@@/*" 别名和 jest 跑测试的前提
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --prefer-offline

      - name: Generate umi artifacts (src/.umi)
        run: npx max setup

      # 硬门禁 1:类型错误直接红。umi 4 的 tsc 只在 node 20 下可靠
      - name: Type check
        run: npx tsc --noEmit

      # 硬门禁 2:6 套件 / 85 用例。契约测试直接读后端 Python 源码比对跨端常量
      - name: Unit tests
        run: npm test

      # 非阻断:仓库存量 34 个 ESLint 错误(22 个文件,多为 CodeEditor/Authorized 等
      # 旧代码的 eqeqeq / guard-for-in / no-unused-vars),不在本次改动范围内,清完
      # 再把 continue-on-error 去掉升级成硬门禁。
      # 注意:不要用 `npm run lint` —— 它的 lint:prettier 是 `prettier -c --write`,
      # 会直接改文件且不因格式问题失败,起不到门禁作用。
      - name: ESLint (报告用,暂不阻断)
        continue-on-error: true
        run: npx eslint --ext .js,.jsx,.ts,.tsx --format=pretty ./src

  ime-probe:
    name: IME 组合期探针
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 只装 playwright(不装整个后端 requirements)—— 探针是纯浏览器行为检查,
      # 不依赖数据库也不依赖后端服务
      - name: Install playwright + chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      # 锁住"中文输入法选词按 Enter"这条浏览器行为契约:
      # 组合期的 keydown 带 isComposing=true 且 key==='Enter',所以裸判 e.key==='Enter'
      # 会把选词误当提交。前端所有 onPressEnter 的 isComposing guard 都依赖这条契约,
      # 浏览器行为漂移时这里会先红。
      - name: Run IME composition probe
        working-directory: backend
        run: python scripts/ime_composition_probe.py
