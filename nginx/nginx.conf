# 新增于 2026-10-14
# /api/*, /auth/*, ...(12 个前缀,匹配 frontend/CLAUDE.md 列的 dev proxy 路径)
#   → backend:7777 (FastAPI/Pity),前缀保留不 strip
# /                            → frontend:80 (nginx:alpine 服务的 UmiJS dist)
# 见 docs/DEPLOY_DOCKER_MIGRATION.md §4.1
#
# 2026-10-14 修订:从单一 /api/ 扩到 11 个前缀(forwardend 实际调了 /auth/, /testcase/ 等);
#                proxy_pass 不带末尾 /,保留完整 URI 到 backend(后端 router 用 APIRouter
#                prefix="/auth" 等定义,不 strip 才能命中)
server {
    listen 80;
    server_name _;

    # AI 聊天流式(SSE): 单独一条规则。
    # ^~ 让前缀匹配优先于下面那条正则, 保证 /ai/chat/* 不会被当成静态资源。
    # proxy_buffering off 是关键: 不关的话 nginx 会把 SSE 攒成一大坨再发,
    # 前端就看不到逐字输出了。后端代码里的 X-Accel-Buffering: no 是第二道保险。
    location ^~ /ai/chat/ {
        proxy_pass http://backend:7777;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        # 大模型生成可能几十秒无输出, 超时给足
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 后端反代:dev proxy 列的 12 个前缀(见 frontend/config/proxy.ts)
    location ~ ^/(api|auth|testcase|config|project|operation|workspace|oss|notification|online|request|ai)/ {
        proxy_pass http://backend:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket 反代:把 /ws/* 转到 backend:7777,带 Upgrade 头
    location /ws/ {
        proxy_pass http://backend:7777;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # 前端静态(用反代而不是直出,这样后续加 HTTPS / 缓存策略更顺手)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
