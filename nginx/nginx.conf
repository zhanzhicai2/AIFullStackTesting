# 新增于 2026-10-14
# /api/*, /auth/*, ...(11 个前缀,匹配 frontend/CLAUDE.md 列的 dev proxy 路径)
#   → backend:7777 (FastAPI/Pity),前缀保留不 strip
# /                            → frontend:80 (nginx:alpine 服务的 UmiJS dist)
# 见 docs/DEPLOY_DOCKER_MIGRATION.md §4.1
#
# 2026-10-14 修订:从单一 /api/ 扩到 11 个前缀(forwardend 实际调了 /auth/, /testcase/ 等);
#                proxy_pass 不带末尾 /,保留完整 URI 到 backend(后端 router 用 APIRouter
#                prefix="/auth" 等定义,不 strip 才能命中)
server {
    listen 80;
    server_name _;

    # 后端反代:dev proxy 列的 11 个前缀(见 frontend/config/proxy.ts)
    location ~ ^/(api|auth|testcase|config|project|operation|workspace|oss|notification|online|request)/ {
        proxy_pass http://backend:7777;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 前端静态(用反代而不是直出,这样后续加 HTTPS / 缓存策略更顺手)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
